plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
}

sourceSets {
    main {
        java.srcDir '../third-module/build_tools/blackobfuscator_plugin/src'
        java.srcDir '../third-module/build_tools/xmlclassguard_plugin/src/main/java'
        resources.srcDir '../third-module/build_tools/blackobfuscator_plugin/resources'
        resources.srcDir '../third-module/build_tools/xmlclassguard_plugin/src/main/resources'
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation 'com.github.megatronking.stringfog:interface:5.0.0'
    implementation gradleApi()
    implementation 'com.android.tools.build:gradle:8.7.0'
    implementation('com.github.CodingGay.BlackObfuscator:dex-tools:2.1') {
        exclude group: 'com.google.guava', module: 'guava'
    }
    implementation 'com.google.guava:guava:32.0.1-jre'
    testImplementation 'junit:junit:4.13.2'
}
