import com.github.megatronking.stringfog.plugin.StringFogMode
import cfns.ydy.atl.NBNL

plugins {
    id 'com.android.application'
    id("walle")
}
apply plugin: 'kotlin-android'
apply plugin: 'android-junk-code'
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'

apply plugin: 'stringfog'

stringfog {
    enable true
    debug false
    // 指定加解密的具体实现类，buildSrc中和app中均要包含此实现源文件
    implementation 'com.stringfog.impl.CustomStringFogImpl'
    // 指定需加密的代码包路径，可配置多个，未指定将默认全部加密
    //    fogPackages = ["cfns.ydy.atl"]
    // 4.0版本新增：使用自定义密钥生成器
    kg new NBNL()
    // 可选（4.0版本新增）：用于控制字符串加密后在字节码中的存在形式, 默认为base64，
    // 也可以使用text或者bytes
     mode StringFogMode.base64
}
apply from: "../third-module/build_tools/jiagu/jiagu.gradle"


androidJunkCode {
    variantConfig {
        release {
            packageBase = "com.cfns.sybg.dpo"
            packageCount = 48
            activityCountPerPackage = 86
            excludeActivityJavaFile = false
            otherCountPerPackage = 84
            methodCountPerClass = 32
            resPrefix = "wrt_"
            drawableCount = 134
            stringCount =  191
        }
    }
}            

xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.example.overseaswhitebag"  : "cfns.xads.zsubm",
                 "com.p.b"  : "cfns.qkwvz.vriuy",
                ]
    //移动目录
    moveDir = [
           "com.example.overseaswhitebag.privacy"   : "cfns.dquv.thlsw",
           "com.example.overseaswhitebag.common.utils"                    : "cfns.xcpfo.usq",
           "com.p.b.master"                                 : "cfns.zramd.zmcmg",
           "com.p.b.op"                                        : "cfns.hwai.ccil",
            "com.p.b.base_api_net"  : "cfns.lvje.vulen",
            "com.p.b.pl223"         : "cfns.iclz.nbcc",
            "com.p.b.common.fcm"     : "cfns.ipy.hugsh",
            "com.p.b.common"         : "cfns.fvpna.byk",
            "com.xian.bc.xin"        : "cfns.kwi.loqu",
            "com.p.b"         : "cfns.mrkkk.cdy",
            "com.catatanbelajar.belajarrr"  : "cfns.dtq.omt",
            "com.deploy"  : "cfns.uzxh.eohnt",

           ]
}

// 加入dex混淆配置
BlackObfuscator {
    // 是否启用
    enabled true
    // 混淆深度（3 比 2 更难反编译，4 以上可能导致方法字节码超限）
    depth 3
    // 所有业务代码都在 cfns.* 下，一个前缀覆盖所有，不会误匹配第三方 SDK
    obfClass = [
                "cfns",
    ]
    // Kotlin 安全配置
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses false
    skipAndroidComponents false
    skipCallbackLikeClasses false
    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = [
                "top.niunaijun.black",
                "androidx",
                "com.google",
                "com.facebook",
                "com.applovin",
                "com.unity3d",
                "com.ironsource",
                "com.chartboost",
                "com.mbridge",
                "com.pangle",
                "com.tradplusad",
                "com.bigossp",
                "com.vungle",
                "com.inmobi",
                "com.huawei",
                "com.hihonor",
                "com.adjust",
                "com.appsflyer",
                "com.tencent",
                "com.squareup",
                "com.jakewharton",
                "com.github",
                "com.fyber",
                "com.smartdigimkttech",
                "com.thinkup",
                "com.mi",
                "com.miui",
                "com.android",
                "org.greenrobot",
                "org.jetbrains",
                "io.reactivex",
                "io.github",
                "kotlin",
                "kotlinx.coroutines",
                "com.stringfog",
    ]
}


android {



    namespace 'com.clean.toos'
    compileSdk 35

    // 临时禁用某些严格检查
    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters "--no-version-vectors"
    }
    defaultConfig {
        applicationId "com.doc.kitool"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "1.0.10"
        ndk {
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
        }
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    ndkVersion "28.0.12433566"
    signingConfigs {
        release {
            keyAlias 'kitool'
            keyPassword '123456'
            storeFile file('kitool.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'kitool'
            keyPassword '123456'
            storeFile file('kitool.jks')
            storePassword '123456'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // 混淆后会被 BlackObfuscator/jiagu 二次处理，mapping 上传无效且会污染线上崩溃归因
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    viewBinding {
        enabled = true
    }

    dataBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding true
    }

    buildFeatures{
        compose true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

dependencies {
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'
    implementation 'com.github.megatronking.stringfog:interface:5.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //implementation files('libs/toolslibrary-release.aar')
    implementation project(':toolsbox')
    implementation project(":aar_library:aar_name2")
    implementation project(":aar_library:aar_name")
    // okeep602.aar 的 BaseJksApplication.attachBaseContext 运行期依赖 me.weishu.reflection.Reflection(FreeReflection)，
    // 裸 aar(artifacts 方式暴露)不带 transitive 依赖，必须在此显式引入，否则启动即 NoClassDefFoundError 崩溃
//    implementation 'com.github.tiann:FreeReflectioneReflection:3.1.0'
    implementation 'com.github.Petterpx.walle:library:1.0.5'
    implementation project(':oversea_base_module')
    implementation project(':stringfogLib')
    // BaseApplication 的超类型 ApplicationListener 在 oversea_common_library 中，
    // oversea_base_module 仅以 implementation 引用，可见性不传递，故在此显式引入。
    implementation project(':oversea_common_library')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.2.0-alpha03'

    // compose
    implementation("androidx.activity:activity-compose:1.7.2")
    implementation(platform("androidx.compose:compose-bom:2024.02.01"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material:material")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.animation:animation")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.4.0")
    implementation("io.coil-kt:coil-compose:2.5.0")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")

    implementation 'com.tencent:mmkv:2.3.0'


}
