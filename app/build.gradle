import com.github.megatronking.stringfog.plugin.StringFogMode
import tiul.iyuhf.xcg.MXE

plugins {
    id 'com.android.application'
    id("walle")
}
apply plugin: 'kotlin-android'
apply plugin: 'android-junk-code'
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'

apply plugin: 'stringfog'

stringfog {
    enable true
    debug false
    // 指定加解密的具体实现类，buildSrc中和app中均要包含此实现源文件
    implementation 'com.stringfog.impl.CustomStringFogImpl'
    // 指定需加密的代码包路径，可配置多个，未指定将默认全部加密
    //    fogPackages = ["tiul.iyuhf.xcg"]
    // 4.0版本新增：使用自定义密钥生成器
    kg new MXE()
    // 可选（4.0版本新增）：用于控制字符串加密后在字节码中的存在形式, 默认为base64，
    // 也可以使用text或者bytes
     mode StringFogMode.base64
}
apply from: "../third-module/build_tools/jiagu/jiagu.gradle"


androidJunkCode {
    def config = {
        packageBase = "com.mistyhui.weather.xia"
        packageCount = 40
        activityCountPerPackage = 40
        excludeActivityJavaFile = false
        otherCountPerPackage = 50
        methodCountPerClass = 50
        resPrefix = "mistyhui_"
        drawableCount = 100
        stringCount = 100
    }
    variantConfig {
//        release config
    }
}

xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.example.overseaswhitebag"  : "tiul.esxc.hsyx",
                 "com.p.b"  : "tiul.dkid.bmq",
                ]
    //移动目录
    moveDir = [
           "com.example.overseaswhitebag.privacy"   : "tiul.gxdno.oarhq",
           "com.example.overseaswhitebag.common.utils"                    : "tiul.msnyg.geg",
           "com.p.b.master"                                 : "tiul.dgfb.ihuci",
           "com.p.b.op"                                        : "tiul.bux.rov",
            "com.p.b.base_api_net"  : "tiul.ydzru.rwvw",
            "com.p.b.pl223"         : "tiul.kbnn.sjb",
            "com.p.b.common.fcm"     : "tiul.umdub.eyly",
            "com.p.b.common"         : "tiul.kqo.zhpx",
            "com.xian.bc.xin"        : "tiul.cbvvv.zne",
            "com.p.b"         : "tiul.njcol.cjnx",
            
           ]
