import com.github.megatronking.stringfog.plugin.StringFogMode
import dfra.fpgsw.fiivw.KFXV

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'walle'
}

apply plugin: 'android-junk-code'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'

apply plugin: 'stringfog'

stringfog {
    enable true
    debug false
    // 指定加解密的具体实现类，buildSrc中和app中均要包含此实现源文件
    implementation 'com.stringfog.impl.CustomStringFogImpl'
    // 指定需加密的代码包路径，可配置多个，未指定将默认全部加密
    //    fogPackages = ["dfra.fpgsw.fiivw"]
    // 4.0版本新增：使用自定义密钥生成器
    kg new KFXV()
    // 可选（4.0版本新增）：用于控制字符串加密后在字节码中的存在形式, 默认为base64，
    // 也可以使用text或者bytes
     mode StringFogMode.base64
}
apply from: '../third-module/build_tools/jiagu/jiagu.gradle'

androidJunkCode {
    variantConfig {
        release {
            packageBase = "com.dfra.ikgkf.mpu"
            packageCount = 58
            activityCountPerPackage = 87
            excludeActivityJavaFile = false
            otherCountPerPackage = 114
            methodCountPerClass = 20
            resPrefix = "iamk_"
            drawableCount = 148
            stringCount =  131
        }
    }
}            

xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.example.overseaswhitebag"  : "dfra.zpahv.ucb",
                 "com.toolsbox.business"  : "dfra.liqfm.aysqb",
                 "com.p.b"  : "dfra.bdi.vhkx",
                ]
    //移动目录
    moveDir = [
           "com.example.overseaswhitebag.privacy"   : "dfra.xvh.efuv",
           "com.example.overseaswhitebag.common.utils"                    : "dfra.cystw.hokno",
           "com.p.b.master"                                 : "dfra.hamdi.kqq",
           "com.p.b.op"                                        : "dfra.qse.nyeg",
            "com.p.b.base_api_net"  : "dfra.otuf.qvfu",
            "com.p.b.pl223"         : "dfra.yptzf.ton",
            "com.p.b.common.fcm"     : "dfra.dkj.rea",
            "com.p.b.common"         : "dfra.upe.lrz",
            "com.xian.bc.xin"        : "dfra.tyo.fjn",
            "com.p.b"         : "dfra.fvq.gchoj",
            "com.catatanbelajar.belajarrr"  : "dfra.ibfn.wqac",
            "com.deploy"  : "dfra.amnpv.xlqp",
            "com.toolsbox.business"  : "dfra.liqfm.aysqb",

           ]
}

BlackObfuscator {
    // 是否启用
    enabled true
    // 全局使用最大控制流深度；高风险结构由方法级硬跳过和验证失败回退兜底
    depth 3
    // 所有业务代码都在 dfra.* 下，一个前缀覆盖所有，不会误匹配第三方 SDK
    obfClass = [
                "dfra",
    ]
    // 发布安全配置：以下高风险结构必须保留原始 R8 方法体
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses true
    skipAndroidComponents true
    skipCallbackLikeClasses true
    // D8 子进程内存与初始分组，失败后插件仍会自动二分回退
    d8MaxHeapMb 1536
    d8InitialGroupSize 64
    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = [
                "top.niunaijun.black",
                "android",
                "android.support",
                "androidx",
                "com.google",
                "com.facebook",
                "com.applovin",
                "com.unity3d",
                "com.ironsource",
                "com.chartboost",
                "com.mbridge",
                "com.pangle",
                // Pangle Mediation 8.1.6.8 运行时真实命名空间；不能只排除 Maven groupId。
                "com.bytedance",
                "com.bykv",
                "com.apm",
                "com.pgl",
                "com.com.bytedance",
                "com.iab.omid.library.bytedance2",
                "ms.bd",
                "com.tradplusad",
                "com.bigossp",
                "com.vungle",
                "com.inmobi",
                "com.huawei",
                "com.hihonor",
                "com.adjust",
                "com.appsflyer",
                "com.tencent",
                "com.squareup",
                "com.jakewharton",
                "com.github",
                "com.fyber",
                "com.smartdigimkttech",
                "com.thinkup",
                "com.mi",
                "com.miui",
                "com.android",
                "org.greenrobot",
                "org.jetbrains",
                "io.reactivex",
                "io.github",
                "kotlin",
                "kotlinx.coroutines",
                "com.stringfog",
    ]
}

android {
    namespace 'com.deploy'
    compileSdk 36

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters '--no-version-vectors'
    }

    defaultConfig {
        applicationId 'com.horizon.weather'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.0.10'
        ndk {
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
        }
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    ndkVersion '28.0.12433566'

    signingConfigs {
        release {
            keyAlias 'horizonWeather'
            keyPassword '123456'
            storeFile file('horizonWeather.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'horizonWeather'
            keyPassword '123456'
            storeFile file('horizonWeather.jks')
            storePassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }

    lint {
        baseline = file('lint-baseline.xml')
    }
}

dependencies {
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'
    implementation 'com.github.megatronking.stringfog:interface:5.0.0'
    implementation project(':toolsbox')
    implementation project(':oversea_base_module')
    implementation project(':oversea_common_library')
    implementation project(':stringfogLib')
    implementation project(':aar_library:aar_name')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.Petterpx.walle:library:1.0.5'
    implementation 'com.tencent:mmkv:2.3.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
