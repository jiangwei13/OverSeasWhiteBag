import com.github.megatronking.stringfog.plugin.StringFogMode
import ibx.fbq.kloqn.YLMB

plugins {
    id 'com.android.application'
    id("walle")
}
apply plugin: 'kotlin-android'
apply plugin: 'android-junk-code'
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'

apply plugin: 'stringfog'

stringfog {
    enable true
    debug false
    // 指定加解密的具体实现类，buildSrc中和app中均要包含此实现源文件
    implementation 'com.stringfog.impl.CustomStringFogImpl'
    // 指定需加密的代码包路径，可配置多个，未指定将默认全部加密
    //    fogPackages = ["ibx.fbq.kloqn"]
    // 4.0版本新增：使用自定义密钥生成器
    kg new YLMB()
    // 可选（4.0版本新增）：用于控制字符串加密后在字节码中的存在形式, 默认为base64，
    // 也可以使用text或者bytes
     mode StringFogMode.base64
}
apply from: "../third-module/build_tools/jiagu/jiagu.gradle"


androidJunkCode {
    variantConfig {
        release {
            packageBase = "com.ibx.rswx.scdj"
            packageCount = 55
            activityCountPerPackage = 89
            excludeActivityJavaFile = false
            otherCountPerPackage = 81
            methodCountPerClass = 31
            resPrefix = "ymvd_"
            drawableCount = 184
            stringCount =  168
        }
    }
}                        

xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.example.overseaswhitebag"  : "ibx.iqv.ugbq",
                 "com.p.b"  : "ibx.xvfv.fsm",
                ]
    //移动目录
    moveDir = [
           "com.example.overseaswhitebag.privacy"   : "ibx.iyzr.ref",
           "com.example.overseaswhitebag.common.utils"                    : "ibx.yco.dvp",
           "com.p.b.master"                                 : "ibx.apfmv.cpvim",
           "com.p.b.op"                                        : "ibx.qhp.uqda",
            "com.p.b.base_api_net"  : "ibx.dvckw.wljk",
            "com.p.b.pl223"         : "ibx.qnezo.djf",
            "com.p.b.common.fcm"     : "ibx.pts.msx",
            "com.p.b.common"         : "ibx.tfbnm.ivqnl",
            "com.xian.bc.xin"        : "ibx.dvtr.zqpd",
            "com.p.b"         : "ibx.csvk.kbv",
            "com.catatanbelajar.belajarrr"  : "ibx.bzoi.lpkev",
            "com.deploy"  : "ibx.qpt.fosg",

           ]
}

// 加入dex混淆配置
BlackObfuscator {
    // 是否启用
    enabled true
    // 混淆深度（3 比 2 更难反编译，4 以上可能导致方法字节码超限）
    depth 3
    // 所有业务代码都在 ibx.* 下，一个前缀覆盖所有，不会误匹配第三方 SDK
    obfClass = [
                "ibx",
    ]
    // Kotlin 安全配置
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses false
    skipAndroidComponents false
    skipCallbackLikeClasses false
    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = [
                "top.niunaijun.black",
                "androidx",
                "com.google",
                "com.facebook",
                "com.applovin",
                "com.unity3d",
                "com.ironsource",
                "com.chartboost",
                "com.mbridge",
                "com.pangle",
                "com.tradplusad",
                "com.bigossp",
                "com.vungle",
                "com.inmobi",
                "com.huawei",
                "com.hihonor",
                "com.adjust",
                "com.appsflyer",
                "com.tencent",
                "com.squareup",
                "com.jakewharton",
                "com.github",
                "com.fyber",
                "com.smartdigimkttech",
                "com.thinkup",
                "com.mi",
                "com.miui",
                "com.android",
                "org.greenrobot",
                "org.jetbrains",
                "io.reactivex",
                "io.github",
                "kotlin",
                "kotlinx.coroutines",
                "com.stringfog",
    ]
}


android {



    namespace 'com.deploy'
    compileSdk 35

    // 临时禁用某些严格检查
    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters "--no-version-vectors"
    }
    defaultConfig {
        applicationId "com.quavix.pdfviewer"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.0.4"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
        }
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    ndkVersion "28.0.12433566"
    signingConfigs {
        release {
            keyAlias 'pdfviewer'
            keyPassword '123456'
            storeFile file('pdfviewer.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'pdfviewer'
            keyPassword '123456'
            storeFile file('pdfviewer.jks')
            storePassword '123456'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // 混淆后会被 BlackObfuscator/jiagu 二次处理，mapping 上传无效且会污染线上崩溃归因
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    viewBinding {
        enabled = true
    }

    dataBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding true
    }

    buildFeatures{
        compose true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

dependencies {
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'
    implementation 'com.github.megatronking.stringfog:interface:5.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
