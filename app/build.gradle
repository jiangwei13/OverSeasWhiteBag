plugins {
    id 'com.android.application'
    id("walle")
}
apply plugin: 'kotlin-android'
apply plugin: 'android-junk-code'
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'
apply from: "../third-module/build_tools/jiagu/jiagu.gradle"

xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    // 正式混淆任务会在构建前写入随机映射，源码基线保持为空。
    packageChange = [:]
    moveDir = [:]
}

BlackObfuscator {
    // 日常 debug 构建不做 dex 控制流混淆。
    enabled gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    depth 2
    mappingFile = file("xml-class-mapping.txt")
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses true
    skipAndroidComponents false
    skipCallbackLikeClasses true
    // 正式混淆任务会按 oversea_base_module 的随机包名重写此处。
    obfClass = []
    blackClass = ["top.niunaijun.black"]
}
androidJunkCode {
    def config = {
        packageBase = "com.cai.hong.huiben"
        packageCount = 40
        activityCountPerPackage = 40
        excludeActivityJavaFile = false
        otherCountPerPackage = 50
        methodCountPerClass = 50
        resPrefix = "hui_"
        drawableCount = 100
        stringCount = 100
    }
    variantConfig {
        // release config
    }
}

android {



    namespace 'com.deploy'
    compileSdk 36

    // 临时禁用某些严格检查
    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters "--no-version-vectors"
    }
    defaultConfig {
        applicationId "com.saowen.magicdoc"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "1.0.3"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
        }
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    ndkVersion "28.0.12433566"
    signingConfigs {
        release {
            keyAlias 'magicdoc'
            keyPassword '123456'
            storeFile file('magicdoc.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'magicdoc'
            keyPassword '123456'
            storeFile file('magicdoc.jks')
            storePassword '123456'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // 二次混淆后 mapping 已失真，禁止上传到 Crashlytics。
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    viewBinding {
        enabled = true
    }

    dataBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding true
    }

    buildFeatures{
        compose true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
//    implementation files('libs/pluginhelper.aar')
    implementation project(':toolsbox')
//    implementation(project(":aar_library:app_aar"))
    implementation 'com.github.Petterpx.walle:library:1.0.5'
    implementation project(':oversea_base_module')
    // BaseApplication 的超类型位于该模块，implementation 依赖不会向上传递。
    implementation project(':oversea_common_library')
    // StringFog 运行期解密实现需要直接进入 app classpath。
    implementation project(':stringfogLib')
//    implementation project(':oversea_report_core')
//    implementation project(':broadcast')
//    implementation project(':base_ad_common_library')

    implementation project(":aar_library:aar_name2")
    implementation project(":aar_library:aar_name")

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.2.0-alpha03'

    // compose
    implementation("androidx.activity:activity-compose:1.7.2")
    implementation(platform("androidx.compose:compose-bom:2024.02.01"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material:material")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.animation:animation")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.4.0")
    implementation("io.coil-kt:coil-compose:2.5.0")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")

    implementation 'com.tencent:mmkv:2.3.0'



}
