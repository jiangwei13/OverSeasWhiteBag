plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'walle'
}

apply plugin: 'android-junk-code'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'
apply from: '../third-module/build_tools/jiagu/jiagu.gradle'

androidJunkCode {
    variantConfig {
        release {
            packageBase = 'com.mistyhui.weather.xia'
            packageCount = 40
            activityCountPerPackage = 40
            excludeActivityJavaFile = false
            otherCountPerPackage = 50
            methodCountPerClass = 50
            resPrefix = 'mistyhui_'
            drawableCount = 100
            stringCount = 100
        }
    }
}

xmlClassGuard {
    // 映射由当前语义源码重新生成，不复用旧混淆工程的映射。
    mappingFile = file('xml-class-mapping.txt')
    packageChange = [
            'com.deploy': 'nmu.qaki.mxft'
    ]
    moveDir = [
            'com.toolsbox.business': 'nmu.svzi.qjyk',
            'com.p.b'                : 'nmu.rzxr.uik'
    ]
}

BlackObfuscator {
    // 只在 release 链启用，避免影响日常调试编译。
    enabled gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    depth 2
    mappingFile = file('xml-class-mapping.txt')
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses true
    skipAndroidComponents false
    skipCallbackLikeClasses true
    // 正式打包时由加固脚本注入实际类列表。
    obfClass = []
    blackClass = ['top.niunaijun.black']
}

android {
    namespace 'com.deploy'
    compileSdk 36

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters '--no-version-vectors'
    }

    defaultConfig {
        applicationId 'com.saowen.magicdoc'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName 1.0.10
        ndk {
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
        }
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    ndkVersion '28.0.12433566'

    signingConfigs {
        release {
            keyAlias 'horizonWeather'
            keyPassword '123456'
            storeFile file('horizonWeather.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'horizonWeather'
            keyPassword '123456'
            storeFile file('horizonWeather.jks')
            storePassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-Xjvm-default=all']
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }

    lint {
        baseline = file('lint-baseline.xml')
    }
}

dependencies {
    implementation project(':toolsbox')
    implementation project(':oversea_base_module')
    implementation project(':oversea_common_library')
    implementation project(':stringfogLib')
    implementation project(':aar_library:aar_name')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.Petterpx.walle:library:1.0.5'
    implementation 'com.tencent:mmkv:2.3.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
