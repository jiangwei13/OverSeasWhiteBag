plugins {
    id 'com.android.application'
    id("walle")
}
apply plugin: 'kotlin-android'
apply plugin: 'android-junk-code'
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'
apply from: "../third-module/build_tools/jiagu/jiagu.gradle"


androidJunkCode {
    variantConfig {
        release {
            packageBase = "com.nmu.pvkf.bcfe"
            packageCount = 57
            activityCountPerPackage = 89
            excludeActivityJavaFile = false
            otherCountPerPackage = 86
            methodCountPerClass = 32
            resPrefix = "apd_"
            drawableCount = 155
            stringCount =  141
        }
    }
}

xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.example.overseaswhitebag"  : "rxyv.ktc.pvhk",
                ]
    //移动目录
    moveDir = [
           "com.example.overseaswhitebag.privacy"   : "rxyv.kly.cgu",
           "com.yao.tool.scenic.bean"   : "rxyv.rfdz.tldtk",
           "com.yao.tool.bean"                    : "rxyv.mpq.llnmy",
           "com.clean.scanlibrary.bean"        : "rxyv.jdtod.wims",
           "com.p.b.base_api_net.base_api_bean"             : "rxyv.adbh.pje",
           "com.clean.pic_toolslibrary"                                 : "rxyv.jmb.zlpen",
           "com.p.b"                                        : "rxyv.mpaq.qsz",
           ]
}

// 加入dex混淆配置
BlackObfuscator {
    // 仅在 release 任务时启用，避免日常 debug 构建被影响
    enabled gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    // 混淆深度
    depth 2
    mappingFile = file("xml-class-mapping.txt")
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses true
    skipAndroidComponents false
    skipCallbackLikeClasses true
    // obfClass 为占位值；ProguardBuilder.prepareBlackObfuscator 在打包时会整块重写，
    // 注入由 stringfog 生成的随机 pkgPrefix 及完整 blackClass 列表
    obfClass = []
    blackClass = ["top.niunaijun.black"]
}


android {



    namespace 'com.clean.toos'
    compileSdk 35

    // 临时禁用某些严格检查
    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters "--no-version-vectors"
    }
    defaultConfig {
        applicationId "com.saowen.magicdoc"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.0.4"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
        }
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    ndkVersion "28.0.12433566"
    signingConfigs {
        release {
            keyAlias 'kitool'
            keyPassword '123456'
            storeFile file('kitool.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'kitool'
            keyPassword '123456'
            storeFile file('kitool.jks')
            storePassword '123456'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // 混淆后会被 BlackObfuscator/jiagu 二次处理，mapping 上传无效且会污染线上崩溃归因
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    viewBinding {
        enabled = true
    }

    dataBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding true
    }

    buildFeatures{
        compose true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //implementation files('libs/toolslibrary-release.aar')
    implementation project(':toolsbox')
    // aar 预留：放入真实 aar 文件(aar_library/aar_name2、aar_library/aar_name 目录内)后取消下面两行注释即可启用
    // implementation project(":aar_library:aar_name2")
    // implementation project(":aar_library:aar_name")
    implementation 'com.github.Petterpx.walle:library:1.0.5'
    implementation project(':oversea_base_module')
    // BaseApplication 的超类型 ApplicationListener 在 oversea_common_library 中，
    // oversea_base_module 仅以 implementation 引用，可见性不传递，故在此显式引入。
    implementation project(':oversea_common_library')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.2.0-alpha03'

    // compose
    implementation("androidx.activity:activity-compose:1.7.2")
    implementation(platform("androidx.compose:compose-bom:2024.02.01"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material:material")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.animation:animation")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.4.0")
    implementation("io.coil-kt:coil-compose:2.5.0")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")

    implementation 'com.tencent:mmkv:2.3.0'


}
