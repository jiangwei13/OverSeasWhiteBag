plugins {
    id 'com.android.application'
    id("walle")
}
apply plugin: 'kotlin-android'
apply plugin: 'android-junk-code'
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'
apply from: "../third-module/build_tools/jiagu/jiagu.gradle"


androidJunkCode {
    variantConfig {
        release {
            packageBase = "com.nmu.pvkf.bcfe"
            packageCount = 57
            activityCountPerPackage = 89
            excludeActivityJavaFile = false
            otherCountPerPackage = 86
            methodCountPerClass = 32
            resPrefix = "apd_"
            drawableCount = 155
            stringCount =  141
        }
    }
}            

xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.p.b"  : "zkw.fft.wvngs",
                ]
    //移动目录
    moveDir = [
           "com.p.b.master"         : "zkw.ita.vrqrs",
           "com.p.b.op"             : "zkw.gkg.hmx",
            "com.p.b.base_api_net"  : "zkw.xetsp.xtwvg",
            "com.p.b.pl223"         : "zkw.fogkp.wmfp",
            "com.p.b.common.fcm"    : "zkw.fzoo.wcdg",
            "com.p.b.common"        : "zkw.rkshx.qntnp",
            "com.p.b"               : "zkw.vlr.tyz",
           ]
}

// 加入dex混淆配置
BlackObfuscator {
    // 是否启用
    enabled true
    // 混淆深度（3 比 2 更难反编译，4 以上可能导致方法字节码超限）
    depth 3
    // 所有业务代码都在 zkw.* 下，一个前缀覆盖所有，不会误匹配第三方 SDK
    obfClass = [
                "zkw",
    ]
    // Kotlin 安全配置
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses false
    skipAndroidComponents false
    skipCallbackLikeClasses false
    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = [
                "top.niunaijun.black",
                "androidx",
                "com.google",
                "com.facebook",
                "com.applovin",
                "com.unity3d",
                "com.ironsource",
                "com.chartboost",
                "com.mbridge",
                "com.pangle",
                "com.tradplusad",
                "com.bigossp",
                "com.vungle",
                "com.inmobi",
                "com.huawei",
                "com.hihonor",
                "com.adjust",
                "com.appsflyer",
                "com.tencent",
                "com.squareup",
                "com.jakewharton",
                "com.github",
                "com.fyber",
                "com.smartdigimkttech",
                "com.thinkup",
                "com.mi",
                "com.miui",
                "com.android",
                "org.greenrobot",
                "org.jetbrains",
                "io.reactivex",
                "io.github",
                "kotlin",
                "kotlinx.coroutines",
                "com.stringfog",
    ]
}


android {



    namespace 'nmu.qaki.mxft'
    compileSdk 36

    // 临时禁用某些严格检查
    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters "--no-version-vectors"
    }
    defaultConfig {
        applicationId "com.fanda.magnisee"
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName "1.1.0"
        ndk {
           // abiFilters 'armeabi-v7a', 'arm64-v8a'
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
        }
        dex {
            useLegacyPackaging true
        }
//        jniLibs {
//            useLegacyPackaging true
//        }
    }
    ndkVersion "28.0.12433566"
    signingConfigs {
        release {
            keyAlias 'magnisee'
            keyPassword '123456'
            storeFile file('magnisee.jks')
            storePassword '123456'
            enableV1Signing true
            enableV2Signing true
        }
        debug {
            keyAlias 'magnisee'
            keyPassword '123456'
            storeFile file('magnisee.jks')
            storePassword '123456'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // 混淆后会被 BlackObfuscator/jiagu 二次处理，mapping 上传无效且会污染线上崩溃归因
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    viewBinding {
        enabled = true
    }

    dataBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding true
    }

    buildFeatures{
        compose true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //implementation files('libs/toolslibrary-release.aar')
    implementation project(':toolsbox')
    implementation project(":aar_library:aar_name2")
    implementation project(":aar_library:aar_name")
    implementation 'com.github.Petterpx.walle:library:1.0.5'
    implementation project(':oversea_base_module')
    // BaseApplication 的超类型 ApplicationListener 在 oversea_common_library 中，
    // oversea_base_module 仅以 implementation 引用，可见性不传递，故在此显式引入。
    implementation project(':oversea_common_library')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.2.0-alpha03'

    // compose
    implementation("androidx.activity:activity-compose:1.7.2")
    implementation(platform("androidx.compose:compose-bom:2024.02.01"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material:material")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.animation:animation")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.4.0")
    implementation("io.coil-kt:coil-compose:2.5.0")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")

    implementation 'com.tencent:mmkv:2.3.0'
// StringFog 运行期解密实现 com.stringfog.impl.CustomStringFogImpl 的独立承载模块
    implementation project(':stringfogLib')

}