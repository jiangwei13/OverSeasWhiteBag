plugins {
    id 'com.android.application'
    id("walle")
}
apply plugin: 'kotlin-android'
apply plugin: 'android-junk-code'
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'
apply from: "../third-module/build_tools/jiagu/jiagu.gradle"


androidJunkCode {
    variantConfig {
        release {
            packageBase = "com.hjsl.kqqno.jny"
            packageCount = 51
            activityCountPerPackage = 66
            excludeActivityJavaFile = false
            otherCountPerPackage = 92
            methodCountPerClass = 22
            resPrefix = "qdh_"
            drawableCount = 148
            stringCount =  127
        }
    }
}                                    



xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.p.b"  : "nuj.lmcdc.bpmmn",
                ]
    //移动目录
    moveDir = [
           "com.p.b.master"         : "nuj.blqbr.cbva",
           "com.p.b.op"             : "nuj.lmgps.tmw",
            "com.p.b.base_api_net"  : "nuj.fdukf.dva",
            "com.p.b.pl223"         : "nuj.njljh.cqjb",
            "com.p.b.common.fcm"    : "nuj.bjh.etd",
            "com.p.b.common"        : "nuj.dofd.iiel",
            "com.p.b"               : "nuj.pqr.pocrw",
           ]
}



// 加入dex混淆配置
BlackObfuscator {
    // 是否启用
    enabled true
    // 混淆深度（3 比 2 更难反编译，4 以上可能导致方法字节码超限）
    depth 3
    // 所有业务代码都在 nuj.* 下，一个前缀覆盖所有，不会误匹配第三方 SDK
    obfClass = [
                "nuj",
    ]
    // Kotlin 安全配置
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses false
    skipAndroidComponents false
    skipCallbackLikeClasses false
    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = [
                "top.niunaijun.black",
                "androidx",
                "com.google",
                "com.facebook",
                "com.applovin",
                "com.unity3d",
                "com.ironsource",
                "com.chartboost",
                "com.mbridge",
                "com.pangle",
                "com.tradplusad",
                "com.bigossp",
                "com.vungle",
                "com.inmobi",
                "com.huawei",
                "com.hihonor",
                "com.adjust",
                "com.appsflyer",
                "com.tencent",
                "com.squareup",
                "com.jakewharton",
                "com.github",
                "com.fyber",
                "com.smartdigimkttech",
                "com.thinkup",
                "com.mi",
                "com.miui",
                "com.android",
                "org.greenrobot",
                "org.jetbrains",
                "io.reactivex",
                "io.github",
                "kotlin",
                "kotlinx.coroutines",
                "com.stringfog",
    ]
}







android {



    namespace 'tmlr.hti.caqq'
    compileSdk 36

    // 临时禁用某些严格检查
    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters "--no-version-vectors"
    }
    defaultConfig {
        applicationId "com.mukuled.ledlightgp"
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName "1.0.5"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
//    packagingOptions {
//
//
//        exclude 'META-INF/DEPENDENCIES'
//        dex {
//            useLegacyPackaging true
//        }
//        exclude 'resources.arsc'
//
//        exclude 'AndroidManifest.xml'
//        jniLibs {
//
//            useLegacyPackaging true
//
//        }
//    }
    packaging {
           resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
         }
         dex { useLegacyPackaging true }
         jniLibs { useLegacyPackaging true }
        }
    ndkVersion "28.0.12433566"
    signingConfigs {
        release {
            keyAlias 'ledlightgp'
            keyPassword '123456'
            storeFile file('ledlightgp.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'ledlightgp'
            keyPassword '123456'
            storeFile file('ledlightgp.jks')
            storePassword '123456'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    viewBinding {
        enabled = true
    }

    dataBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding true
    }

    buildFeatures{
        compose true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

