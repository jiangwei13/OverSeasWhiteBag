androidJunkCode {
    def config = {
        packageBase = "com.local.weather.xia"
        packageCount = 40
        activityCountPerPackage = 40
        excludeActivityJavaFile = false
        otherCountPerPackage = 50
        methodCountPerClass = 50
        resPrefix = "mistyhui_"
        drawableCount = 100
        stringCount = 100
    }
    variantConfig {
//        release config
    }
}

// 加入dex混淆配置
BlackObfuscator {
    // 是否启用
    enabled true
    // 混淆深度（3 比 2 更难反编译，4 以上可能导致方法字节码超限）
    depth 3
    // 所有业务代码都在 odz.* 下，一个前缀覆盖所有，不会误匹配第三方 SDK
    obfClass = [
                "odz",
    ]
    // Kotlin 安全配置
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses false
    skipAndroidComponents false
    skipCallbackLikeClasses false
    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = [
                "top.niunaijun.black",
                "androidx",
                "com.google",
                "com.facebook",
                "com.applovin",
                "com.unity3d",
                "com.ironsource",
                "com.chartboost",
                "com.mbridge",
                "com.pangle",
                "com.tradplusad",
                "com.bigossp",
                "com.vungle",
                "com.inmobi",
                "com.huawei",
                "com.hihonor",
                "com.adjust",
                "com.appsflyer",
                "com.tencent",
                "com.squareup",
                "com.jakewharton",
                "com.github",
                "com.fyber",
                "com.smartdigimkttech",
                "com.thinkup",
                "com.mi",
                "com.miui",
                "com.android",
                "org.greenrobot",
                "org.jetbrains",
                "io.reactivex",
                "io.github",
                "kotlin",
                "kotlinx.coroutines",
                "com.stringfog",
    ]
}


