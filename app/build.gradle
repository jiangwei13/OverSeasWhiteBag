import com.github.megatronking.stringfog.plugin.StringFogMode
import recp.fkxnw.vxwng.ITRF

plugins {
    id 'com.android.application'
    id("walle")
}
apply plugin: 'kotlin-android'
apply plugin: 'android-junk-code'
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'

apply plugin: 'stringfog'

stringfog {
    enable true
    debug false
    // 指定加解密的具体实现类，buildSrc中和app中均要包含此实现源文件
    implementation 'com.stringfog.impl.CustomStringFogImpl'
    // 指定需加密的代码包路径，可配置多个，未指定将默认全部加密
    //    fogPackages = ["recp.fkxnw.vxwng"]
    // 4.0版本新增：使用自定义密钥生成器
    kg new ITRF()
    // 可选（4.0版本新增）：用于控制字符串加密后在字节码中的存在形式, 默认为base64，
    // 也可以使用text或者bytes
     mode StringFogMode.base64
}
apply from: "../third-module/build_tools/jiagu/jiagu.gradle"

xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
    //更改manifest文件的package属性，即包名
    packageChange = [
                 "com.example.overseaswhitebag"  : "recp.qauwc.xgb",
                 "com.p.b"  : "recp.squc.jbh",
                ]
    //移动目录
    moveDir = [
           "com.example.overseaswhitebag.privacy"   : "recp.onjo.apy",
           "com.example.overseaswhitebag.common.utils"                    : "recp.crjj.puxzm",
           "com.p.b.master"                                 : "recp.cbd.fcyd",
           "com.p.b.op"                                        : "recp.fhjbw.nsabz",
            "com.p.b.base_api_net"  : "recp.ech.hwfos",
            "com.p.b.pl223"         : "recp.gjz.jla",
            "com.p.b.common.fcm"     : "recp.qzjg.xevwt",
            "com.p.b.common"         : "recp.cfb.vfq",
            "com.xian.bc.xin"        : "recp.shn.medjk",
            "com.p.b"         : "recp.yrkk.iuma",
            "com.catatanbelajar.belajarrr"  : "recp.uvs.gwl",
            "com.deploy"  : "recp.xxfh.jqhtg",

           ]
}

BlackObfuscator {
    // 是否启用
    enabled true
    // 全局使用最大控制流深度；高风险结构由方法级硬跳过和验证失败回退兜底
    depth 3
    // 所有业务代码都在 recp.* 下，一个前缀覆盖所有，不会误匹配第三方 SDK
    obfClass = [
                "recp",
    ]
    // 发布安全配置：以下高风险结构必须保留原始 R8 方法体
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses true
    skipAndroidComponents true
    skipCallbackLikeClasses true
    // D8 子进程内存与初始分组，失败后插件仍会自动二分回退
    d8MaxHeapMb 1536
    d8InitialGroupSize 64
    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = [
                "top.niunaijun.black",
                "android",
                "android.support",
                "androidx",
                "com.google",
                "com.facebook",
                "com.applovin",
                "com.unity3d",
                "com.ironsource",
                "com.chartboost",
                "com.mbridge",
                "com.pangle",
                "com.tradplusad",
                "com.bigossp",
                "com.vungle",
                "com.inmobi",
                "com.huawei",
                "com.hihonor",
                "com.adjust",
                "com.appsflyer",
                "com.tencent",
                "com.squareup",
                "com.jakewharton",
                "com.github",
                "com.fyber",
                "com.smartdigimkttech",
                "com.thinkup",
                "com.mi",
                "com.miui",
                "com.android",
                "org.greenrobot",
                "org.jetbrains",
                "io.reactivex",
                "io.github",
                "kotlin",
                "kotlinx.coroutines",
                "com.stringfog",
    ]
}
androidJunkCode {
    def config = {
        packageBase = "com.cai.hong.huiben"
        packageCount = 40
        activityCountPerPackage = 40
        excludeActivityJavaFile = false
        otherCountPerPackage = 50
        methodCountPerClass = 50
        resPrefix = "hui_"
        drawableCount = 100
        stringCount = 100
    }
    variantConfig {
        // release config
    }
}

android {



    namespace 'com.deploy'
    compileSdk 36

    // 临时禁用某些严格检查
    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        additionalParameters "--no-version-vectors"
    }
    defaultConfig {
        applicationId "com.board.chroma"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "1.0.10"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'resources.arsc', 'AndroidManifest.xml']
        }
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    ndkVersion "28.0.12433566"
    signingConfigs {
        release {
            keyAlias 'chroma'
            keyPassword '123456'
            storeFile file('chroma.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'chroma'
            keyPassword '123456'
            storeFile file('chroma.jks')
            storePassword '123456'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // 二次混淆后 mapping 已失真，禁止上传到 Crashlytics。
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    viewBinding {
        enabled = true
    }

    dataBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding true
    }

    buildFeatures{
        compose true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

