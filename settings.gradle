pluginManagement {
    repositories {
        maven { url 'https://www.jitpack.io' }
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        google()
        mavenCentral()
        maven { url = uri("https://www.jitpack.io") }
        maven { url = uri("https://jitpack.io") }

        // TopOn SDK (AnyThink)
        maven { url 'https://jfrog.anythinktech.com/artifactory/overseas_sdk' }
        // 荣耀 HMS
        maven { url 'https://developer.hihonor.com/repo' }
        // Chartboost
        maven { url 'https://cboost.jfrog.io/artifactory/chartboost-mediation' }
        // Pangle
        maven { url 'https://artifact.bytedance.com/repository/pangle' }
        // Mintegral
        maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }
        // InMobi
        maven { url 'https://dl.bintray.com/inmobi-sdk/maven' }
        // 华为 HMS
        maven { url 'https://developer.huawei.com/repo/' }
        // Fyber / DT Exchange
        maven { url 'https://android-sdk.is.com/' }
        // IronSource
        maven { url 'https://android-sdk.is.com/' }
        /////////////////////////////////// TradPlus相关引用///////////////////////
        // Ironsource
        maven { url 'https://android-sdk.is.com/' }
        // Pangle
        maven {
            url 'https://artifact.bytedance.com/repository/pangle'
        }
        // Chartboost
        maven { url "https://cboost.jfrog.io/artifactory/chartboost-ads/" }
        maven {
            name "Chartboost Mediation’s maven repo"
            url "https://cboost.jfrog.io/artifactory/chartboost-mediation"
        }
        // Mintegral
        //Launch GP market application， Android X Version
        //If you fail to pull the code using gradle, add the maven warehouse configuration to the project root build.gradle file
        maven {
            url  "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea"
        }
    }
}


