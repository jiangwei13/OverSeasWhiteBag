ext {
    android = [
            versionCode: 3,
            versionName: '1.0.3'
    ]

    dependencies = [:]

    appConfig = [
            // 天气产品身份配置。
            'privacyUrl'           : 'https://sites.google.com/view/horizonweather/home/privacy',
            'userUrl'              : 'https://sites.google.com/view/horizonweather/home/terms',
            'VERSIONNAME'          : android.versionName,

            // 海外公共底座与广告配置，沿用 PDF 新底座。
            'logSwitch'            : true,
            'ad_LiveTime'          : '2026-07-16 18:00:00',
            'ad_huawei_LiveTime'   : '2025-12-06 10:00:00',
            'HOST'                 : '',
            'DEBUG_APPID'          : '',
            'RELEASE_APPID'        : '',
            'DEBUG_SSK'            : '',
            'RELEASE_SSK'          : '',
            'isDebug'              : 'false',
            'buglyId'              : '',
            'Admob_AppId'          : 'ca-app-pub-1589775842977386~2029736308',
            'umID'                 : '',
            'TOPON_APPID'          : 'h691eb23982b34',
            'TOPON_APPKEY'         : 'abb325d6a80de9f580f2f41dc6a825556',
            'TradPlus_ID'          : 'CB94948BA3CBE894EB0558B1E3FFE211',
            'AF_APP_KEY'           : '',
            'ADJUST_TOKEN'         : 'vjjythxozc3k',
            'PANGLE_APPID'         : '8597626',
            'ADSDK_ACTIVE_PROVIDER': 'pangle',

            // setting 模块仍读取这些兼容字段。
            'APPID'                : '',
            'INTER_ID'             : '',
            'FISRT_SPLASH'         : '',
            'FIRST_REWORD'         : ' '
    ]
}

def adSdkActiveProvider = rootProject.ext.appConfig['ADSDK_ACTIVE_PROVIDER']
        ?.toString()
        ?.trim()
        ?.toLowerCase(Locale.ROOT)

def providerHelp = '''
请在 config.gradle 的 appConfig 中配置 ADSDK_ACTIVE_PROVIDER：
    pangle   - 固定使用 Pangle
    tradplus - 固定使用 TradPlus
    remote   - 从 config.json 的 adsdk_init.active_provider 读取
'''.stripIndent().trim()

if (!adSdkActiveProvider) {
    throw new GradleException("ADSDK_ACTIVE_PROVIDER 不能为空。\n${providerHelp}")
}

def supportedProviders = ['pangle', 'tradplus', 'remote']
if (!supportedProviders.contains(adSdkActiveProvider)) {
    throw new GradleException(
            "ADSDK_ACTIVE_PROVIDER=${adSdkActiveProvider} 无效。\n${providerHelp}")
}

rootProject.ext.appConfig['ADSDK_ACTIVE_PROVIDER'] = adSdkActiveProvider
